# Fly.io deploy config for the backend. Three processes = three machines,
# matching Fly's historical free-allowance machine count. Deploy from
# backend/ with:
#   fly deploy --config ../infra/fly.toml --dockerfile Dockerfile
#
# IMPORTANT — verify before assuming free: Fly's pricing/free-allowance terms
# have changed before and may again. Check your dashboard's usage/billing
# page after the first deploy to confirm actual cost is $0 at this scale.
#
# IMPORTANT — memory: YOLO + torch need more than 256mb to run without
# crashing (confirmed the hard way on an 8GB dev machine that still got tight
# under this same workload). Start with AI_PROVIDER_MODE=stub to verify the
# deployment mechanics work on a small VM; only switch to AI_PROVIDER_MODE=local
# once you've sized the "app" VM up (try 512mb or 1024mb — this likely exceeds
# the purest free tier a little, but should still be very cheap at idle/low
# usage; check actual billing rather than assuming).
app = "cip-backend"
primary_region = "iad"

[build]

[processes]
  app = "uvicorn cip.main:app --host 0.0.0.0 --port 8000"
  # -B embeds Celery Beat's periodic scheduler inside the worker process,
  # so this one machine covers both — no separate beat machine needed.
  worker = "celery -A cip.celery_app worker -B --loglevel=info --concurrency=2"
  stream_manager = "python -m cip.services.ingestion.stream_manager"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
