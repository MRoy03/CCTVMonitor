services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: cip
      POSTGRES_USER: cip
      POSTGRES_PASSWORD: cip
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]

  redis:
    image: redis:7
    ports: ["6379:6379"]

  qdrant:
    image: qdrant/qdrant:latest
    ports: ["6333:6333"]
    volumes: ["qdrantdata:/qdrant/storage"]

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: cipadmin
      MINIO_ROOT_PASSWORD: cipadmin123
    ports: ["9000:9000", "9001:9001"]
    volumes: ["miniodata:/data"]

  backend:
    build:
      context: ../backend
    command: uvicorn cip.main:app --host 0.0.0.0 --port 8000 --reload
    volumes: ["../backend:/app"]
    ports: ["8000:8000"]
    env_file: ../backend/.env
    depends_on: [postgres, redis, minio]

  worker:
    build:
      context: ../backend
    command: celery -A cip.celery_app worker --loglevel=info --concurrency=2
    volumes: ["../backend:/app"]
    env_file: ../backend/.env
    depends_on: [postgres, redis, minio]

  beat:
    build:
      context: ../backend
    command: celery -A cip.celery_app beat --loglevel=info
    volumes: ["../backend:/app"]
    env_file: ../backend/.env
    depends_on: [postgres, redis]

volumes:
  pgdata:
  qdrantdata:
  miniodata:
